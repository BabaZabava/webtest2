<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="description" content="Krudý Crystal KidZ přináší nové album a další píčoviny.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <title>Crystal KidZ | Home</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">
      <a href="#"><img src="logo.png" alt="Crystal KidZ"></a>
    </div>

    <div class="hamburger" onclick="toggleMenu()">
      &#9776;
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <div class="dropdown">
        <p class="parby">Pařby od CK</p>
        <a href="nekonečnej.html">Nekonečnej Pták</a>
        <a href="#" style="text-decoration: line-through;">## #####</a>
      </div>
    </div>

    <div class="socky">
      <a href="https://www.instagram.com/crystalkidzclub?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" style="text-decoration: none; color: #ccffcc;" target="_blank"><i class="fa fa-instagram" style="font-size:36px"></i><a>
    </div>
  </div>


  <!-- LANDING -->
  <section class="landing">
    <p>Album EHHE vychází — 19.11.</p>
    <div id="countdown" class="countdown">
      <span>00d</span>
      <span>00h</span>
      <span>00m</span>
      <span>00s</span>
    </div>
    <div class="links">
      <a href="https://tynikdy.lnk.to/EHHE" class="btn" target="_blank"><span>Poslouchej!</span></a>
      <a href="https://shop.tynikdy.cz/crystal-kidz-white-tee/" class="btn" target="_blank"><span>Merch</span></a>
      <a href="http://shop.tynikdy.cz/crystal-kidz-ehhe-lp/" class="btn" target="_blank"><span>Pre-order vinyl</span></a>
    </div>
  </section>

  <footer>
    <div class="footer">
      <p>Vykadil: Altuux</p>
    </div>
  </footer>

  <!-- LOGO SOUND -->
  <script>
    const zvuk = new Audio("krudejzvuk.m4a");
    const logo = document.querySelector(".logo");
    logo.addEventListener("click", () => {
      zvuk.currentTime = 0;
      zvuk.play();
    });
  </script>

  <!--MENU-->
  <script>
  function toggleMenu() {
    document.querySelector('.nav-links').classList.toggle('active');
    document.querySelector('.hamburger').classList.toggle('active');
  }
  </script>

  <!-- COUNTDOWN -->
  <script src="countdown.js"></script>
</body>
</html>
